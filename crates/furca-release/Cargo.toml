[package]
name = "furca-release"
description = "The release engine behind furca: reads release.toml and says what to release and what stands in the way."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["release", "semver", "changelog", "conventional-commits", "git"]
categories = ["development-tools"]

[dependencies]
furca-core = { path = "../furca-core", version = "0.2.0" }
# The parser git-cliff-core uses, on purpose: the plan's reading of a commit
# and the changelog's (v0.4) must be one reading, not two that drift.
git-conventional = "0.12"
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1"
# Blocking and small: the plan asks two registries one question each.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
