[package]
name = "furca-release"
description = "The release engine behind furca: reads release.toml, plans the next release and runs it from the bump to a proven install."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["release", "semver", "changelog", "conventional-commits", "git"]
categories = ["development-tools"]

[dependencies]
furca-core = { path = "../furca-core", version = "0.9.0" }
# The parser git-cliff-core uses, on purpose: the plan's reading of a commit
# and the changelog's must be one reading, not two that drift. It moves when
# git-cliff-core moves, not before.
git-conventional = "0.12"
# Writes the release's changelog section from the repository's own
# cliff.toml. Without `repo`: the history comes from furca-core, not libgit2.
git-cliff-core = { version = "2.14", default-features = false }
semver = { version = "1", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The install proof: the installed binary hashes as the release's own.
sha2 = "0.11"
# Where the install proof unpacks the release's archive.
tempfile = "3"
thiserror = "2"
toml = "1"
# Rewrites a manifest's version and keeps every comment and space around it.
toml_edit = "0.25"
# Blocking and small: the plan asks two registries one question each.
ureq = { version = "3", default-features = false, features = ["rustls", "json"] }
# Reads a workflow's `on:`. The version git-cliff-core already builds
# through `config`, so the engine adds no second YAML parser; it moves when
# that one does.
yaml-rust2 = { version = "0.11", default-features = false }

[lints]
workspace = true
