[package]
name = "furca-core"
description = "The engine behind furca: reads through gitoxide, mutations through the system git."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
readme = "../../README.md"
keywords = ["git", "gitoxide", "log", "refs"]
categories = ["development-tools"]

[dependencies]
# `sha1` is a feature of its own, outside `max-performance`: without it
# gix-hash fails with a cascade of type errors that hide the real cause.
# `max-performance` is pure Rust since gix 0.90, which retired the C zlib and
# the `-safe` twin that used to stand for that.
# `basic` brings objects and references, `revision` the history walk,
# `status` the working tree's changes.
gix = { version = "0.90.0", default-features = false, features = ["max-performance", "sha1", "basic", "revision", "status"] }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
# The window's TypeScript types, generated from these (ADR 0009). Off unless
# the desktop app asks: a library user gets no new dependency.
ts-rs = { version = "12", optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
serde_json = "1"
tempfile = "3"

[lints]
workspace = true

[[bench]]
name = "budgets"
harness = false
