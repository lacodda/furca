name: Publish

# A tag publishes the crates through crates.io trusted publishing (OIDC), one
# trusted publisher per crate, in dependency order. A version crates.io already
# holds is skipped, so a re-run picks up where a publish stopped - including
# after a new crate's first publish, which is by hand because trusted
# publishing can only be set up for a crate that exists. workflow_dispatch
# re-runs a tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (vX.Y.Z)
        required: true

permissions: {}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Get a crates.io token (OIDC trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish what crates.io does not hold yet
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "furca-core") | .version')
          test -n "$version"
          for crate in furca-core furca-release furca; do
            status=$(curl -s -o /dev/null -w '%{http_code}' \
              -A 'furca-publish (+https://github.com/lacodda/furca)' \
              "https://crates.io/api/v1/crates/$crate/$version")
            case "$status" in
              200) echo "$crate $version is on crates.io already" ;;
              404) cargo publish -p "$crate" ;;
              *) echo "crates.io answered $status for $crate $version" >&2; exit 1 ;;
            esac
          done
