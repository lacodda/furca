name: Publish

# Both crates were published by hand at v0.1.0; from then on a tag publishes
# them through crates.io trusted publishing (OIDC), one trusted publisher per
# crate. workflow_dispatch re-runs a tag whose publish failed.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Tag to publish (e.g. v0.1.0)
        required: true

permissions: {}

jobs:
  crates-io:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Get a crates.io token (OIDC trusted publishing)
        uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish furca-core
        run: cargo publish -p furca-core
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
      - name: Publish furca
        run: cargo publish -p furca
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
