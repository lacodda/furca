name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  backend:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (webkit2gtk for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The speed budgets are part of the gate: a red benchmark is a red build.
  # The report is kept as an artifact so a regression can be read, not only
  # seen.
  budgets:
    name: budgets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the budgets
        run: cargo bench -p furca-core --bench budgets
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: budgets-${{ matrix.os }}
          path: target/budgets.json
          if-no-files-found: ignore

  # The window's budgets, measured on the built app: it is started some thirty
  # times, so it needs a display - Linux gets a virtual one.
  window-budgets:
    name: window budgets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # A start that hangs is stopped by the benchmark; this is the net under
    # that, well past a run that works (about ten minutes with the build).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (webkit2gtk for Tauri) and a display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb dbus
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Measure the window
        shell: bash
        env:
          # WebKitGTK on a runner with no GPU: without these it waits on a
          # renderer the virtual display cannot give. Read on Linux only.
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
        run: |
          # A desktop has a session bus, and GTK and WebKitGTK ask it for
          # their settings; without one each start waited 25 + 10 s on its
          # timeouts. The virtual display gets one of its own.
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a dbus-run-session --"; else run=""; fi
          $run cargo bench -p furca-desktop --bench window --features custom-protocol
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: window-budgets-${{ matrix.os }}
          path: target/budgets-window.json
          if-no-files-found: ignore

  # The action installs the CLI from a release on every runner, and the CLI
  # answers there: the door for CI works without the owner's machine. The
  # installed CLI is the last release, one behind this checkout, so it is not
  # asked to plan it - release.toml may already have a shape the last release
  # never knew, and that is no fault of the action.
  action:
    name: action (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags: without them every release looks like the first.
          fetch-depth: 0
      - id: furca
        uses: ./
      - name: The installed CLI is the latest release and reads this repository
        shell: bash
        run: |
          set -eu
          latest=$(curl -fsSLI -o /dev/null -w '%{url_effective}' "https://github.com/$GITHUB_REPOSITORY/releases/latest")
          latest="${latest##*/}"
          said=$(furca --version)
          echo "latest release $latest, installed: $said"
          test "$said" = "furca ${latest#v}"
          furca log -n 3
          furca release --help > /dev/null

  # rust-version is a promise to anyone building this. Without a job that
  # actually builds on it, the number silently rots the first time a newer API
  # is used. Each package keeps its own: the crates on crates.io promise a low
  # number, the window follows Tauri. So every distinct rust-version in the
  # workspace is installed and the packages that declare it are built on it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (webkit2gtk for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Build each package on its declared rust-version
        run: |
          set -euo pipefail
          groups=$(cargo metadata --no-deps --format-version 1 | jq -r '[.packages[] | {v: .rust_version, n: .name}] | group_by(.v)[] | "\(.[0].v) \(map("-p " + .n) | join(" "))"')
          test -n "$groups"
          while read -r version packages; do
            test "$version" != null
            echo "::group::rust $version: $packages"
            rustup toolchain install "$version" --profile minimal --no-self-update
            cargo "+$version" check $packages --all-targets
            echo "::endgroup::"
          done <<< "$groups"

  # The desktop bundle is what a user actually installs; a green `cargo test`
  # does not prove it links, and a linked binary does not prove it packages.
  # Every installer the three platforms make is kept with the run; the release
  # page carries them once installers are signed (v0.23).
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (webkit2gtk for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xdg-utils file
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build and bundle the application
        run: pnpm tauri build
      - uses: actions/upload-artifact@v7
        with:
          name: bundle-${{ matrix.os }}
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/dmg/*.dmg
          if-no-files-found: error
