name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Build
        run: pnpm build

  backend:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (webkit2gtk for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # The speed budgets are part of the gate: a red benchmark is a red build.
  # The report is kept as an artifact so a regression can be read, not only
  # seen.
  budgets:
    name: budgets (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the budgets
        run: cargo bench -p furca-core --bench budgets
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: budgets-${{ matrix.os }}
          path: target/budgets.json
          if-no-files-found: ignore

  # rust-version is a promise to anyone building this. Without a job that
  # actually builds on it, the number silently rots the first time a newer API
  # is used. Each package keeps its own: the crates on crates.io promise a low
  # number, the window follows Tauri. So every distinct rust-version in the
  # workspace is installed and the packages that declare it are built on it.
  msrv:
    name: msrv
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (webkit2gtk for Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: Swatinem/rust-cache@v2
      - name: Build each package on its declared rust-version
        run: |
          set -euo pipefail
          groups=$(cargo metadata --no-deps --format-version 1 | jq -r'[.packages[] | {v: .rust_version, n: .name}] | group_by(.v)[] | "\(.[0].v) \(map("-p " + .n) | join(" "))"')
          test -n "$groups"
          while read -r version packages; do
            test "$version" != null
            echo "::group::rust $version: $packages"
            rustup toolchain install "$version" --profile minimal --no-self-update
            cargo "+$version" check $packages --all-targets
            echo "::endgroup::"
          done <<< "$groups"

  # The desktop bundle is what a user actually installs; a green `cargo test`
  # does not prove it links.
  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (webkit2gtk for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - name: Build the application
        run: pnpm tauri build --no-bundle
