name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The draft is created first so every platform's job has somewhere to upload
  # to; publishing happens only once they all succeed.
  draft:
    name: draft
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `furca ${tag}`,
              body: 'See CHANGELOG.md for what changed.',
              draft: true,
              prerelease: false,
            })
            return data.id

  # The CLI is what the release page carries. The window exists since v0.7,
  # but its installers wait for signing (v0.23): an unsigned installer on the
  # release page is one SmartScreen and Gatekeeper refuse. CI bundles it on
  # every push, for every platform, so packaging cannot rot in the meantime.
  cli:
    name: cli (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the furca CLI
        run: cargo build --release -p furca --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # One top-level folder per archive, named like the archive: the
          # installers in tools/ unpack it by that name.
          tag="${GITHUB_REF#refs/tags/}"
          name="furca-${tag}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/furca.exe "$name/"
          7z a "$name.zip" "$name"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="furca-${tag}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/furca "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Upload to the draft release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const path = process.env.ASSET
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              name: path,
              data: fs.readFileSync(path),
            })

  # The measured budgets travel with the release that was measured: the docs
  # site reads them from here, so a page of numbers never outlives the build
  # it describes.
  budgets:
    name: budgets (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the budgets
        run: cargo bench -p furca-core --bench budgets
      - name: Upload to the draft release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              name: 'budgets-${{ matrix.target }}.json',
              data: fs.readFileSync('target/budgets.json'),
            })

  # The window's budgets travel the same way, measured on the built app.
  window-budgets:
    name: window budgets (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    # A start that hangs is stopped by the benchmark; this is the net under
    # that, well past a run that works (about ten minutes with the build).
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (webkit2gtk for Tauri) and a display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf xvfb
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Measure the window
        shell: bash
        env:
          # WebKitGTK on a runner with no GPU: without these it waits on a
          # renderer the virtual display cannot give. Read on Linux only.
          WEBKIT_DISABLE_DMABUF_RENDERER: 1
          WEBKIT_DISABLE_COMPOSITING_MODE: 1
        run: |
          if [ "$RUNNER_OS" = Linux ]; then run="xvfb-run -a"; else run=""; fi
          $run cargo bench -p furca-desktop --bench window --features custom-protocol
      - name: Upload to the draft release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              name: 'budgets-window-${{ matrix.target }}.json',
              data: fs.readFileSync('target/budgets-window.json'),
            })

  publish:
    name: publish
    # The builds and the measurements for the ordering, `draft` for the
    # release id.
    needs: [draft, cli, budgets, window-budgets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To rebuild the docs: a release published with GITHUB_TOKEN does not
      # trigger other workflows, a dispatch does.
      actions: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              draft: false,
            })
      - name: Rebuild the docs with this release's budgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --repo ${{ github.repository }} --ref main
