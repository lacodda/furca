name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The draft is created first so every platform's job has somewhere to upload
  # to; publishing happens only once they all succeed.
  draft:
    name: draft
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `Furca ${tag}`,
              body: 'See CHANGELOG.md for what changed.',
              draft: true,
              prerelease: false,
            })
            return data.id

  bundle:
    name: desktop (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps (webkit2gtk for Tauri)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: pnpm install --frozen-lockfile
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          args: --target ${{ matrix.target }}

  # The desktop bundle carries the GUI; this job builds and packages the
  # headless `furca` CLI binary on its own, for the same three targets.
  cli:
    name: cli (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the furca CLI
        run: cargo build --release -p furca --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          out="furca-${tag}-${{ matrix.target }}.zip"
          cd target/${{ matrix.target }}/release
          7z a "../../../$out" furca.exe
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          out="furca-${tag}-${{ matrix.target }}.tar.gz"
          tar -czf "$out" -C target/${{ matrix.target }}/release furca
          echo "ASSET=$out" >> "$GITHUB_ENV"
      - name: Upload to the draft release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const path = process.env.ASSET
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              name: path,
              data: fs.readFileSync(path),
            })

  publish:
    name: publish
    # All three: `bundle` and `cli` for the ordering, `draft` for the release id.
    needs: [draft, bundle, cli]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              draft: false,
            })
