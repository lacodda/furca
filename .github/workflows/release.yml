name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # The draft is created first so every platform's job has somewhere to upload
  # to; publishing happens only once they all succeed.
  draft:
    name: draft
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.result }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/github-script@v9
        id: create
        with:
          script: |
            const tag = context.ref.replace('refs/tags/', '')
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: tag,
              name: `furca ${tag}`,
              body: 'See CHANGELOG.md for what changed.',
              draft: true,
              prerelease: false,
            })
            return data.id

  # The CLI is what ships until the window exists (v0.7): the desktop shell in
  # src-tauri is scaffolding, and an installer of scaffolding would put a
  # non-product on the release page under the product's name. CI still builds
  # it on every push so it cannot rot in the meantime.
  cli:
    name: cli (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - name: Build the furca CLI
        run: cargo build --release -p furca --target ${{ matrix.target }}
      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # One top-level folder per archive, named like the archive: the
          # installers in tools/ unpack it by that name.
          tag="${GITHUB_REF#refs/tags/}"
          name="furca-${tag}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/furca.exe "$name/"
          7z a "$name.zip" "$name"
          echo "ASSET=$name.zip" >> "$GITHUB_ENV"
      - name: Package (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          name="furca-${tag}-${{ matrix.target }}"
          mkdir "$name"
          cp target/${{ matrix.target }}/release/furca "$name/"
          tar -czf "$name.tar.gz" "$name"
          echo "ASSET=$name.tar.gz" >> "$GITHUB_ENV"
      - name: Upload to the draft release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const path = process.env.ASSET
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              name: path,
              data: fs.readFileSync(path),
            })

  # The measured budgets travel with the release that was measured: the docs
  # site reads them from here, so a page of numbers never outlives the build
  # it describes.
  budgets:
    name: budgets (${{ matrix.target }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Measure the budgets
        run: cargo bench -p furca-core --bench budgets
      - name: Upload to the draft release
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              name: 'budgets-${{ matrix.target }}.json',
              data: fs.readFileSync('target/budgets.json'),
            })

  publish:
    name: publish
    # `cli` and `budgets` for the ordering, `draft` for the release id.
    needs: [draft, cli, budgets]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # To rebuild the docs: a release published with GITHUB_TOKEN does not
      # trigger other workflows, a dispatch does.
      actions: write
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: ${{ needs.draft.outputs.release_id }},
              draft: false,
            })
      - name: Rebuild the docs with this release's budgets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run docs.yml --repo ${{ github.repository }} --ref main
