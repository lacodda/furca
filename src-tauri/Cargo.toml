[package]
name = "furca-desktop"
description = "Furca: a fast cross-platform git client (Tauri v2 desktop app)."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# The window follows its framework: Tauri 2.12 needs 1.90. The crates people
# build from crates.io keep the workspace's lower number; the CI `msrv` job
# holds each package to its own.
rust-version = "1.90"
# The desktop app ships as an installer, never as a crate.
publish = false
# Presentation rasters are for the README and the release page, not for anyone
# building from the crate. icon.ico stays: build.rs needs it on Windows.
exclude = [
    "../assets/social-preview.png",
    "../assets/logo-512.png",
    "../assets/apple-touch-icon.png",
    "../assets/favicon-32.png",
]

[lib]
name = "furca_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
# `ts`: the core's types are the window's types, generated (ADR 0009).
furca-core = { path = "../crates/furca-core", version = "0.9.0", features = ["ts"] }
# The record's list of the owner's projects, which the window opens as the
# line - the one place furca talks to rigger.
furca-release = { path = "../crates/furca-release", version = "0.9.0" }
# `unstable`: a window made apart from its webview, so it is on the screen
# before the webview has started (ADR 0011).
tauri = { version = "2.12", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8"
tauri-plugin-opener = "2.7"
# One window per data directory; a second start opens its paths in the first.
tauri-plugin-single-instance = "2.5"
ts-rs = "12"

[dev-dependencies]
tempfile = "3"

[features]
# What `tauri build` turns on: the frontend is served from inside the binary
# rather than from the dev server. The window's benchmark is built with it.
custom-protocol = ["tauri/custom-protocol"]

# The window's speed budgets, measured on the built app: `cargo bench -p
# furca-desktop --bench window --features custom-protocol`, after `pnpm build`.
[[bench]]
name = "window"
harness = false

[lints]
workspace = true
