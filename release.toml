# How furca is released, read by `furca release`.
# Reference: https://lacodda.github.io/furca/reference/release/

[project]
name = "furca"
changelog = "CHANGELOG.md"
# The workspace root carries the version for every crate and for the path
# dependencies between them.
manifests = ["Cargo.toml", "package.json", "src-tauri/tauri.conf.json"]
# ADRs record what happened. The release page's examples, the refs sample and
# the line sample show numbers of their own, not the version being released.
as_written = [
    "docs/adr/",
    "docs/src/content/docs/reference/line.md",
    "docs/src/content/docs/reference/release.md",
    "docs/src/content/docs/reference/refs.md",
]

# Formatting only: it takes seconds and compiles nothing. The rest of the gate is
# CI, which the run waits for before the tag (ADR 0017).
[gate]
commands = [
    "cargo fmt --all --check",
]

[ci]
provider = "github"
workflow = "ci.yml"
publish = "publish.yml"

# In publishing order: each one depends on the ones above it. The libraries
# only: the furca CLI is installed by tools/install.ps1 and tools/install.sh
# from the release, never from a registry.
[[package]]
registry = "crates"
name = "furca-core"
manifest = "crates/furca-core/Cargo.toml"

[[package]]
registry = "crates"
name = "furca-release"
manifest = "crates/furca-release/Cargo.toml"

# The files the tag's release page has to carry: checked after the publish,
# and against the targets the installers ask for before the tag.
[page]
assets = [
    "furca-{tag}-x86_64-pc-windows-msvc.zip",
    "furca-{tag}-x86_64-unknown-linux-gnu.tar.gz",
    "furca-{tag}-aarch64-apple-darwin.tar.gz",
]

# The CLI is installed for the owner from the release by the installers in
# tools/, and proven to be the release's own build.
[post.install]
