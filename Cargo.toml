[workspace]
resolver = "3"
members = ["crates/furca-core", "crates/furca-cli", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
authors = ["Kirill Lakhtachev <lahtachev@gmail.com>"]
repository = "https://github.com/lacodda/furca"
homepage = "https://lacodda.github.io/furca/"
# Measured, not copied from the toolchain: 1.85 fails on let-chains in a gix
# dependency (human_format), 1.88 is the first version that builds. Raised only
# when a dependency or a feature needs it; see the CI `msrv` job, which builds on
# this number so it cannot silently rot.
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# Line-table debug info keeps backtraces readable while cutting the .pdb weight
# that dominates target/debug. Full debug info is a one-line revert when needed.
[profile.dev]
debug = 1
